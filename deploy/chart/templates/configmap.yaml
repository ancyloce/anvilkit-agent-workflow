{{- include "anvilkit-agent-workflow.require" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anvilkit-agent-workflow.workerName" . }}
  labels:
    {{- include "anvilkit-agent-workflow.workerLabels" . | nindent 4 }}
  {{- with include "anvilkit-agent-workflow.workerAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
    {{- include "anvilkit-agent-workflow.config" . | nindent 4 }}
