{{- include "anvilkit-agent-workflow.require" . -}}
{{- $cfg := include "anvilkit-agent-workflow.config" . -}}
{{- $drain := int .Values.shutdown.drainSeconds -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvilkit-agent-workflow.fullname" . }}
  labels:
    {{- include "anvilkit-agent-workflow.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anvilkit-agent-workflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anvilkit-agent-workflow.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A changed configuration file rolls the Pods.
        checksum/config: {{ $cfg | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The worker's ServiceAccount token is its launcher identity (in-cluster
      # client-go configuration); the Jobs it creates never mount one.
      serviceAccountName: {{ include "anvilkit-agent-workflow.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # No injected service-link variables: the configuration loader rejects
      # any ANVILKIT_WORKFLOW_* variable outside its allowlist.
      enableServiceLinks: false
      # The drain bound plus the worker's close allowance (10 s) and a margin
      # before the kubelet's SIGKILL; derived, never set below the bound.
      terminationGracePeriodSeconds: {{ add $drain 15 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: workflow
          image: {{ include "anvilkit-agent-workflow.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The allowlisted environment overrides of internal/config: the file
          # path and the placement values. No kubeconfig: the launcher uses
          # the mounted ServiceAccount identity.
          env:
            - name: ANVILKIT_WORKFLOW_CONFIG
              value: /etc/anvilkit/anvilkit-agent-workflow/config.yaml
            - name: ANVILKIT_WORKFLOW_TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: ANVILKIT_WORKFLOW_CONTROL_ADDRESS
              value: {{ .Values.control.address | quote }}
            - name: ANVILKIT_WORKFLOW_LAUNCH_BACKEND
              value: {{ .Values.launcher.backend | quote }}
            - name: ANVILKIT_WORKFLOW_IMAGE_REGISTRY
              value: {{ .Values.launcher.imageRegistry | quote }}
            - name: ANVILKIT_WORKFLOW_SIDECAR_CONTROL_ADDRESS
              value: {{ .Values.launcher.sidecarControlAddress | quote }}
            - name: ANVILKIT_WORKFLOW_BUILD_ID
              value: {{ include "anvilkit-agent-workflow.buildId" . | quote }}
            - name: ANVILKIT_WORKFLOW_HEALTH_LISTEN
              value: {{ printf "0.0.0.0:%d" (int .Values.health.port) | quote }}
            {{- if .Values.telemetry.otlpEndpoint }}
            - name: ANVILKIT_WORKFLOW_TELEMETRY_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            {{- end }}
            {{- with .Values.modelProxy.address }}
            - name: ANVILKIT_WORKFLOW_MODEL_PROXY_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.modelProxy.address (eq .Values.identity.mode "development") }}
            # DEVELOPMENT_ONLY: the bearer token of the Model Proxy client.
            - name: ANVILKIT_WORKFLOW_MODEL_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "modelProxy.tokenSecret.name is required under identity.mode development with a modelProxy.address" .Values.modelProxy.tokenSecret.name }}
                  key: {{ .Values.modelProxy.tokenSecret.key }}
            {{- end }}
            {{- if .Values.pagix.declarationConfigMap }}
            - name: ANVILKIT_WORKFLOW_PAGIX_URL
              value: {{ .Values.pagix.baseUrl | quote }}
            {{- end }}
            {{- with .Values.knowledge.address }}
            - name: ANVILKIT_WORKFLOW_KNOWLEDGE_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            {{- if not (hasPrefix "ANVILKIT_WORKFLOW_" .name) }}
            {{- fail (printf "extraEnv %s is not an ANVILKIT_WORKFLOW_ placement" .name) }}
            {{- end }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/anvilkit/anvilkit-agent-workflow
              readOnly: true
            {{- if eq .Values.identity.mode "mtls" }}
            - name: identity
              mountPath: /etc/anvilkit/identity
              readOnly: true
            {{- end }}
            {{- if ne .Values.temporal.tls.mode "development" }}
            - name: temporal-ca
              mountPath: /etc/anvilkit/temporal-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.telemetry.otlpEndpoint (ne .Values.telemetry.otlpTls.mode "development") }}
            - name: otlp-ca
              mountPath: /etc/anvilkit/otlp-ca
              readOnly: true
            {{- end }}
            {{- if .Values.pagix.declarationConfigMap }}
            - name: pagix-declaration
              mountPath: /etc/anvilkit/pagix
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anvilkit-agent-workflow.fullname" . }}
        {{- if eq .Values.identity.mode "mtls" }}
        - name: identity
          secret:
            secretName: {{ include "anvilkit-agent-workflow.identitySecret" . }}
            defaultMode: 0440
        {{- end }}
        {{- if ne .Values.temporal.tls.mode "development" }}
        - name: temporal-ca
          secret:
            secretName: {{ .Values.temporal.tls.caSecret.name }}
            items:
              - key: {{ .Values.temporal.tls.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if and .Values.telemetry.otlpEndpoint (ne .Values.telemetry.otlpTls.mode "development") }}
        - name: otlp-ca
          secret:
            secretName: {{ .Values.telemetry.otlpTls.caSecret.name }}
            items:
              - key: {{ .Values.telemetry.otlpTls.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if .Values.pagix.declarationConfigMap }}
        - name: pagix-declaration
          configMap:
            name: {{ .Values.pagix.declarationConfigMap }}
            items: [{key: declaration.yaml, path: declaration.yaml}]
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
