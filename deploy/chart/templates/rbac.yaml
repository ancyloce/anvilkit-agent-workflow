{{- if .Values.rbac.create }}
# The launcher's least-privilege permissions (DD-03 §4, DD-10 §4), owned by
# this chart: Jobs create/get/list/watch/delete, Pods read, and the
# per-launch Secret (DEC-045: the launch secret both harness containers
# receive by reference) create/delete only, in the components namespace
# only; never get, list or watch on secrets, so the launcher can read
# neither the sidecar identity Secret nor a launch secret back; no exec,
# no ephemeral containers, no token minting. The binding names the
# worker's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "anvilkit-agent-workflow.fullname" . }}-launcher
  namespace: {{ .Values.launcher.namespace }}
  labels:
    {{- include "anvilkit-agent-workflow.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "anvilkit-agent-workflow.fullname" . }}-launcher
  namespace: {{ .Values.launcher.namespace }}
  labels:
    {{- include "anvilkit-agent-workflow.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "anvilkit-agent-workflow.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "anvilkit-agent-workflow.fullname" . }}-launcher
  apiGroup: rbac.authorization.k8s.io
{{- end }}
