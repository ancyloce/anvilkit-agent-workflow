# Chart values of anvilkit-agent-workflow. Only what this worker needs: its
# image, its reviewed configuration file, the allowlisted placement
# overrides, the launcher identity and its least-privilege permissions,
# probes and resources. Environment values (addresses, the launch backend,
# the registry, replica counts, the pinned image digest) are supplied by the
# deploying repository per environment; no secret enters this chart and the
# worker reads none.

image:
  repository: anvilkit-agent-workflow
  # tag defaults to the chart's appVersion; digest, when set, pins the exact
  # image (repository@sha256:...) and takes precedence over the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 2

# HorizontalPodAutoscaler (autoscaling/v2). Off unless the environment enables
# it with an explicit maxReplicas: the maximum is bounded by downstream caps
# and the database connection budget (deploy/gitops/lock.yaml), never a chart
# default. While enabled the Deployment leaves replicas to the autoscaler.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 0
  targetCPUUtilizationPercentage: 70

# The launcher identity: the worker's ServiceAccount, whose mounted token
# is the only Kubernetes credential the worker uses (no kubeconfig in the
# image or the chart). This chart is the single owner of the launcher's
# RBAC: the Role and RoleBinding in launcher.namespace grant exactly what
# internal/adapters/kubernetes does - Jobs create/get/list/watch/delete and
# Pods get/list/watch - and nothing else (no exec, no secrets, no token
# minting). Candidate Jobs never receive a ServiceAccount token: the
# launcher's template disables automount on every Job Pod.
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true
rbac:
  create: true

# The launcher's placements (ANVILKIT_WORKFLOW_LAUNCH_BACKEND,
# ANVILKIT_WORKFLOW_IMAGE_REGISTRY, ANVILKIT_WORKFLOW_SIDECAR_CONTROL_ADDRESS)
# and the namespace the Jobs run in (the reviewed file's kubernetes.namespace).
launcher:
  namespace: anvilkit-components
  backend: ""
  imageRegistry: ""
  sidecarControlAddress: ""

# The Temporal frontend (ANVILKIT_WORKFLOW_TEMPORAL_ADDRESS) and the Control
# gRPC endpoint (ANVILKIT_WORKFLOW_CONTROL_ADDRESS). Required. temporal.tls is
# the frontend transport: tls verifies the frontend against the CA bundle of
# caSecret (key ca.crt) and serverName; mtls additionally presents the
# workload certificate of identity; development is the plaintext frontend of
# the development foundation (development.enabled only). control.serverName
# is the DNS SAN Control's certificate must carry (default its service name).
temporal:
  address: ""
  tls:
    mode: tls
    serverName: ""
    caSecret:
      name: ""
      key: ca.crt
control:
  address: ""
  serverName: anvilkit-agent-control

# The worker's workload identity (P0.1): the certificate every mtls client
# of this worker presents (Control, the Model Proxy, Temporal under mtls)
# and verifies its peers against. The certificate is a cert-manager
# Certificate this chart renders (certificate.create) from issuerRef, or an
# existing Secret (secretName, keys tls.crt, tls.key, ca.crt) when create
# is false; the files are mounted at /etc/anvilkit/identity and reloaded
# as a whole. mode development renders plaintext clients and only with
# development.enabled: true.
identity:
  mode: mtls
  trustDomain: ""
  secretName: ""
  certificate:
    create: true
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 720h

# The Model Proxy client's server name under mtls (the DNS SAN the Proxy's
# certificate carries); the placement itself is config.model_proxy /
# ANVILKIT_WORKFLOW_MODEL_PROXY_ADDRESS of the environment.
modelProxy:
  serverName: anvilkit-agent-model-proxy

# The access sidecar of every harness Job Pod (kubernetes.sidecar): under
# identity mode mtls the launcher mounts the Secret of the sidecar's own
# workload certificate (read-only, into the sidecar container alone) and
# this chart renders that certificate into launcher.namespace from the same
# issuer; development is the plaintext sidecar of the development foundation
# (development.enabled only). The sidecar's identity is the certificate's URI
# SAN (spiffe://<trustDomain>/ns/<launcher.namespace>/sa/anvilkit-job-access-sidecar);
# no ServiceAccount of that name exists and Job Pods carry no token.
sidecar:
  identityMode: mtls
  identitySecret: anvilkit-job-access-sidecar-identity

# The top-level DEVELOPMENT_ONLY guard: every development transport
# (identity.mode, temporal.tls.mode, telemetry.otlpTls.mode,
# sidecar.identityMode) renders only while this is true; it downgrades
# nothing by itself.
development:
  enabled: false

# The Worker Build ID (ANVILKIT_WORKFLOW_BUILD_ID): the image digest when
# one is pinned, else the tag; set buildId to name it explicitly.
buildId: ""

# The health listener inside the Pod (ANVILKIT_WORKFLOW_HEALTH_LISTEN):
# /healthz while the process runs, /readyz while both pollers are started.
health:
  port: 9102

# The reviewed, secret-free configuration file (config.yaml sections):
# rendered into a ConfigMap and mounted at ANVILKIT_WORKFLOW_CONFIG. The
# placement values above override it through the allowlisted environment;
# the execution bounds are frozen into each Workflow run at its start.
config:
  temporal:
    address: 127.0.0.1:27233
    namespace: anvilkit
    task_queue: anvilkit-workflow
    control_task_queue: anvilkit-workflow-control
    worker_identity: anvilkit-agent-workflow
    build_id: dev
  control:
    address: 127.0.0.1:9101
  kubernetes:
    namespace: anvilkit-components
    enabled_profiles: [local-check-v1]
    candidate_seccomp_profile: anvilkit/candidate.json
  execution:
    control_activity_timeout: 30s
    control_retry_initial: 1s
    control_retry_max_interval: 30s
    control_retry_max_attempts: 6
    launch_window: 2m
    observe_heartbeat_timeout: 30s
    observe_max_attempts: 3
    cleanup:
      timeout: 3m
      max_attempts: 2
      unresolved_settle_window: 60s
      create_request_lifetime: 3m
      reconcile_initial_interval: 5s
      reconcile_max_interval: 1m
      reconcile_max_duration: 24h
  health:
    listen: 127.0.0.1:9102
  # shutdown_timeout is rendered from shutdown.drainSeconds below.

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 256Mi

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# Shutdown: on SIGTERM the worker reports not ready, stops both Task Queues
# from accepting work at once and drains their in-flight Activities for at
# most shutdown.drainSeconds together (the configuration's shutdown_timeout,
# rendered from this value; 1 to 300 as the worker accepts), then closes its
# clients and the health listener within its fixed close allowance (10 s,
# internal/bootstrap). The Pod's termination grace period is derived as
# drainSeconds + 15 (the allowance and a margin before SIGKILL), so no
# supported drain bound outlives the Pod.
shutdown:
  drainSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Telemetry placement (P23): the collector's OTLP endpoint for spans
# (ANVILKIT_WORKFLOW_TELEMETRY_OTLP_ENDPOINT) (the metrics are on the health listener's /metrics); empty disables it.
# Scraping is the environment's pod annotations.
telemetry:
  otlpEndpoint: ""
  # The collector transport while otlpEndpoint is set: tls verifies the
  # collector against caSecret (key ca.crt) and serverName, mtls also presents
  # the workload certificate, development is plaintext (development.enabled).
  otlpTls:
    mode: tls
    serverName: ""
    caSecret:
      name: ""
      key: ca.crt
