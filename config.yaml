# anvilkit-agent-workflow configuration (reviewed, secret-free). Loaded by
# internal/config with precedence defaults < this file < allowed environment
# overrides (ANVILKIT_WORKFLOW_TEMPORAL_ADDRESS, ANVILKIT_WORKFLOW_CONTROL_ADDRESS,
# ANVILKIT_WORKFLOW_MODEL_PROXY_ADDRESS, ANVILKIT_WORKFLOW_MODEL_PROXY_TOKEN (secret),
# ANVILKIT_WORKFLOW_KUBECONFIG, ANVILKIT_WORKFLOW_LAUNCH_BACKEND,
# ANVILKIT_WORKFLOW_BUILD_ID, ANVILKIT_WORKFLOW_IMAGE_REGISTRY,
# ANVILKIT_WORKFLOW_SIDECAR_CONTROL_ADDRESS, ANVILKIT_WORKFLOW_HEALTH_LISTEN,
# ANVILKIT_WORKFLOW_IDENTITY_{CERT,KEY,CA}_FILE).
# Unknown keys fail startup. The execution section is frozen into each
# Workflow run's history at its start.
#
# identity: the process's workload certificate, key and CA bundle (P0.1;
# placements from the environment, .local/dev/certs on the foundation),
# watched and reloaded as a whole; every mtls client below uses them.
identity:
  reload_interval: 5s
temporal:
  address: 127.0.0.1:27233
  namespace: anvilkit
  task_queue: anvilkit-workflow
  control_task_queue: anvilkit-workflow-control
  worker_identity: anvilkit-agent-workflow
  build_id: dev
  # tls: the frontend transport; development is the foundation's plaintext
  # Temporal (DEVELOPMENT_ONLY, needs development.enabled), tls verifies the
  # frontend against ca_file/server_name, mtls also presents the workload
  # certificate (server-side TLS is P0.6).
  tls:
    mode: development
control:
  address: 127.0.0.1:9101
  # identity: mtls presents the workload certificate and verifies Control
  # by server_name (a DNS SAN of its certificate); development is plaintext
  # and needs development.enabled.
  identity:
    mode: mtls
    mtls:
      server_name: anvilkit-agent-control
# model_proxy: the Model Proxy placement of the controlled model call
# Activities (P11; ANVILKIT_WORKFLOW_MODEL_PROXY_ADDRESS). Without an address
# CallModel/GetModelCall/CancelModelCall answer DEPENDENCY_UNAVAILABLE. The
# identity the worker presents: mtls is the workload certificate (the
# process identity, verified by server_name); development is a
# DEVELOPMENT_ONLY bearer token supplied only through
# ANVILKIT_WORKFLOW_MODEL_PROXY_TOKEN (needs development.enabled).
model_proxy:
  timeout: 5m
  identity:
    mode: mtls
    mtls:
      server_name: anvilkit-agent-model-proxy
# kubernetes.kubeconfig (the launcher identity of a worker outside the
# cluster; empty selects the Pod's in-cluster ServiceAccount identity) and
# kubernetes.launch_backend are deployment placements supplied through the
# environment.
kubernetes:
  namespace: anvilkit-components
  # enabled_profiles: the reviewed profiles this environment may launch. A
  # harness profile joins this list only after its negative tests passed on
  # the target runtime (delivery.md P09); codegen-fixed-v1 (gVisor) stays
  # disabled here. harness-wiring-dev-v1 is DEVELOPMENT_ONLY and is enabled
  # by the integration scenarios' launcher, not by this file.
  enabled_profiles: [local-check-v1]
  # image_registry completes profile images that name no registry (the
  # development registry of deploy/dev, ANVILKIT_WORKFLOW_IMAGE_REGISTRY).
  # sidecar.control_address is the Control placement the access sidecar of a
  # Job Pod uses (ANVILKIT_WORKFLOW_SIDECAR_CONTROL_ADDRESS); identity_mode
  # mtls mounts the sidecar's workload certificate (identity_secret, the
  # Workflow chart's Certificate in the Job namespace) into the sidecar
  # container alone; development (plaintext) needs development.enabled.
  sidecar:
    identity_mode: mtls
    identity_secret: anvilkit-job-access-sidecar-identity
  candidate_seccomp_profile: anvilkit/candidate.json
execution:
  control_activity_timeout: 30s
  control_retry_initial: 1s
  control_retry_max_interval: 30s
  control_retry_max_attempts: 6
  launch_window: 2m
  observe_heartbeat_timeout: 30s
  observe_max_attempts: 3
  cleanup:
    timeout: 3m
    max_attempts: 2
    unresolved_settle_window: 60s
    # how long an unanswered create request can still commit after its
    # Activity ended; must exceed the API server's --request-timeout (60s)
    create_request_lifetime: 3m
    reconcile_initial_interval: 5s
    reconcile_max_interval: 1m
    reconcile_max_duration: 24h
# lifecycle (P13): the Preparation analysis call (the controlled route the
# analysis uses, its output and exposure bounds, the frozen content-repair
# allowance) and the Generation admission and lease supervision (the permit
# poll interval, the lease TTL asked of the port, the renewal lead, the lease
# call bound, the definition activations this worker registers: an id must
# be one Control's generation profile lists; an empty profile or a negative
# max_repairs inherits Control's value). pagix_double_dir
# (ANVILKIT_WORKFLOW_PAGIX_DOUBLE_DIR) places the DEVELOPMENT_ONLY lease,
# source and content-digest doubles; without it every generation fails at
# bootstrap with DEPENDENCY_UNAVAILABLE and no preparation freezes a brief
# (ENV-07 supplies the real declarations).
lifecycle:
  preparation:
    route_id: controlled-openai-v1
    max_output_tokens: 2048
    max_exposure_currency: USD
    max_exposure_amount: "100000"
    call_timeout: 5m
    content_repair_allowance: 1
    max_input_bytes: 262144
  generation:
    permit_poll_interval: 30s
    lease_ttl: 10m
    lease_renew_lead: 3m
    lease_call_timeout: 20s
    definitions:
      - id: generation-v1:def-1
        max_repairs: -1
      - id: generation-v1:def-2
        max_repairs: 0
  artifacts:
    transfer_window: 15m
  # preview (P20): the reviewed job profile that builds a preview's saved
  # revision: bound source is candidate code (P0.8), validator-source-v1
  # under gVisor by default; DEVELOPMENT_ONLY here the same chain on the
  # foundation's containerd runtime (state development, this guard).
  preview:
    build_profile: validator-source-dev-v1
  # release (P21): the reviewed validator profile that certifies the exact
  # source (validator-source-v1 by default; DEVELOPMENT_ONLY here
  # validator-source-dev-v1, P0.8), the release
  # profile's destinations (DEVELOPMENT_ONLY names served by the Pagix
  # double until ENV-07/08), the maintainer's approval wait (never beyond
  # the operation deadline), its poll interval, the polls one run makes
  # before it continues as new, and the bounded original-identity queries of
  # an unknown target.
  release:
    validator_profile: validator-source-dev-v1
    npm_registry: https://registry.anvilkit.invalid/
    browser_origin: https://components.anvilkit.invalid
    approval_wait: 336h
    approval_poll: 30s
    polls_per_run: 200
    reconcile_rounds: 20
    reconcile_pause: 30s
# development: the top-level DEVELOPMENT_ONLY guard (P0.1) and the fault
# injection switch. This checked-in file configures host-side runs on the
# development foundation, whose Temporal frontend and OTLP collector are
# plaintext (temporal.tls.mode development above); the guard downgrades
# nothing by itself: the gRPC and Proxy clients and the sidecar stay mtls.
# Never enable outside the foundation; the chart renders its own file.
development:
  enabled: true
# health: the worker's only HTTP surface (ANVILKIT_WORKFLOW_HEALTH_LISTEN):
# /healthz while the process runs, /readyz while both pollers are started
# and neither the shutdown nor a fatal worker error has ended it.
health:
  listen: 127.0.0.1:9102
# shutdown_timeout: the drain bound of the whole worker ([1s, 5m]). On stop
# both Task Queues stop accepting work at once and their in-flight
# Activities share this bound before they are abandoned to Temporal's
# retries; the clients and the health listener close after it. The chart
# derives the Pod's termination grace period from this value.
shutdown_timeout: 30s
